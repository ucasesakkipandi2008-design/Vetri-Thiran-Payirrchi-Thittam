<!doctype html><html><head><meta charset="UTF-8"><title>{{ comic.title }}</title><link rel="stylesheet" href="/static/css/style.css"></head><body><div class="container"><h1>{{ comic.title }}</h1><div class="comic-grid">{% for panel in comic.panels %}<article class="panel"><img src="{{ panel.image_url }}" alt="Panel {{ panel.panel_number }}"><h3>Panel {{ panel.panel_number }}</h3><p><strong>Scene:</strong> {{ panel.scene }}</p><p><strong>Narration:</strong> {{ panel.narration }}</p><p><strong>Caption:</strong> {{ panel.caption }}</p><p><strong>Dialogue:</strong> {{ panel.dialogue }}</p></article>{% endfor %}</div>{% if comic.pdf_path %}<p><a class="button" href="{{ comic.pdf_path }}" target="_blank">Open PDF</a></p>{% endif %}<p><a href="/">Create another comic</a></p></div></body></html>
